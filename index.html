<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Coincheur</title>
<meta name="description" content="La belote coinchée entre amis, en ligne ou en tournoi duplicate.">
<meta name="theme-color" content="#134535">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coincheur">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Zilla+Slab:wght@500;700&display=swap">
<style>
/* Mise en page : une colonne étroite façon feuille de marque de club, et une table de jeu en tapis plein écran. */
:root {
  --bg: #e7ece8; --surface: #f8faf8; --ink: #14201a; --muted: #56675e; --line: #cdd7d1;
  --felt: #1c5b44; --felt-2: #134535; --felt-ink: #e6f0ea; --felt-muted: #a9c6b7;
  --red: #c3252d; --gold: #d9a52f; --card: #fffdf7; --card-ink: #16161a;
  --ok: #2c7a4b; --bad: #b2352e; --chip: #dfe7e2;
  --f-display: "Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1411; --surface: #151f1a; --ink: #e2ebe5; --muted: #91a399; --line: #283630;
  --felt: #164a37; --felt-2: #0d3123; --felt-ink: #e6f0ea; --felt-muted: #93b4a3;
  --red: #e2555b; --gold: #e3b448; --card: #f3f0e8; --card-ink: #16161a;
  --ok: #5cb880; --bad: #e0675f; --chip: #22302a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1411; --surface: #151f1a; --ink: #e2ebe5; --muted: #91a399; --line: #283630;
  --felt: #164a37; --felt-2: #0d3123; --felt-ink: #e6f0ea; --felt-muted: #93b4a3;
  --red: #e2555b; --gold: #e3b448; --card: #f3f0e8; --card-ink: #16161a;
  --ok: #5cb880; --bad: #e0675f; --chip: #22302a; color-scheme: dark }
html { box-sizing: border-box; height: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { height: 100%; margin: 0; }
*, *::before, *::after { box-sizing: inherit; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 2.1rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.red { color: var(--red); }
.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark { width: 52px; height: 52px; border-radius: 12px; background: var(--felt); display: grid; place-items: center; flex: none; position: relative; overflow: hidden; }
.brand-mark span { position: absolute; width: 22px; height: 30px; background: var(--card); border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.35); font-family: var(--f-display); font-weight: 700; font-size: 14px; color: var(--card-ink); display: grid; place-items: center; }
.brand-mark span:nth-child(1) { transform: rotate(-16deg) translate(-8px, 2px); }
.brand-mark span:nth-child(2) { transform: rotate(14deg) translate(8px, 1px); color: var(--red); }
.section { display: flex; flex-direction: column; gap: 12px; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.btn { border: 0; border-radius: 9px; padding: 12px 18px; font-weight: 700; background: var(--chip); }
.btn.primary { background: var(--felt); color: var(--felt-ink); }
.btn.gold { background: var(--gold); color: #1c1606; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; background: none; border: 0; text-align: left; width: 100%; }
.item .meta { font-size: 0.875rem; color: var(--muted); }
.chev { color: var(--muted); font-size: 1.3rem; }
.mode { font-size: 0.8125rem; display: flex; gap: 8px; align-items: flex-start; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-top: 6px; flex: none; }
.dot.on { background: var(--ok); }
.err { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line)); color: var(--ink); padding: 10px 14px; border-radius: 9px; font-size: 0.9rem; display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; }
.err button { background: none; border: 0; color: var(--muted); padding: 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: 0.9rem; }
input[type=text] { font: inherit; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; box-sizing: border-box; }
.stepper { display: flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; width: max-content; background: var(--surface); }
.stepper button { border: 0; background: var(--chip); width: 46px; height: 44px; font-size: 1.3rem; font-weight: 700; }
.stepper output { min-width: 56px; text-align: center; font-family: var(--f-num); font-size: 1.15rem; font-weight: 600; }
.pad { padding: 16px; }
.rules { font-size: 0.9rem; color: var(--muted); }
.rules summary { cursor: pointer; font-weight: 700; color: var(--ink); padding: 14px 16px; }
.rules ul { margin: 0; padding: 0 16px 16px 34px; display: flex; flex-direction: column; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 0.9rem; }
.chip.on { background: var(--felt); color: var(--felt-ink); border-color: var(--felt); }
.sched { overflow-x: auto; }
.sched table, .tbl { border-collapse: collapse; font-size: 0.875rem; width: 100%; }
.sched th, .sched td, .tbl th, .tbl td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
.sched th, .tbl th { font-size: 0.75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.sched td.me { background: color-mix(in srgb, var(--gold) 16%, transparent); }
.prog { font-family: var(--f-num); font-size: 0.8rem; color: var(--muted); }
.prog.full { color: var(--ok); font-weight: 600; }
.rank { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 10px 16px; }
.rank .pos { font-family: var(--f-num); color: var(--muted); }
.rank .pct { font-family: var(--f-num); font-weight: 600; font-size: 1.05rem; }
.bar { height: 4px; background: var(--chip); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--felt); }
.round { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; }
.round .set { width: 40px; height: 40px; border-radius: 8px; background: var(--chip); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; }
.round.done .set { background: color-mix(in srgb, var(--ok) 25%, var(--chip)); }
.round.cur .set { background: var(--gold); color: #1c1606; }
.seatrow { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; align-items: center; padding: 10px 16px; }
.seatrow .who { font-weight: 700; }
.seatrow .who small { display: block; font-weight: 400; color: var(--muted); font-size: 0.75rem; }
.toggle { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.toggle button { border: 0; background: var(--surface); padding: 8px 10px; font-size: 0.85rem; font-weight: 700; color: var(--muted); }
.toggle button.on { background: var(--felt); color: var(--felt-ink); }

/* ---- Table de jeu ---- */
.game { height: 100%; display: flex; flex-direction: column; background: var(--felt-2); color: var(--felt-ink); }
.gbar { display: flex; align-items: center; gap: 10px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 10px; background: var(--felt-2); }
.gbar button { background: none; border: 0; color: var(--felt-muted); font-weight: 700; padding: 6px 4px; }
.gctx { flex: 1; min-width: 0; font-size: 0.8125rem; color: var(--felt-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gscore { display: flex; gap: 6px; font-family: var(--f-num); font-size: 0.8125rem; }
.gscore span { background: rgba(0,0,0,.25); padding: 3px 8px; border-radius: 6px; }
.felt { flex: 1; min-height: 250px; position: relative; background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--felt) 88%, white) 0%, var(--felt) 55%, var(--felt-2) 100%); overflow: hidden; }
.seat { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; max-width: 34%; }
.seat .nm { font-weight: 700; font-size: 0.875rem; padding: 3px 10px; border-radius: 999px; background: rgba(0,0,0,.28); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.seat.turn .nm { background: var(--gold); color: #1c1606; }
.seat .tag { font-size: 0.6875rem; color: var(--felt-muted); letter-spacing: .05em; }
.seat .bub { font-family: var(--f-num); font-size: 0.8125rem; background: var(--card); color: var(--card-ink); padding: 2px 8px; border-radius: 6px; font-weight: 600; }
.seat .bub.pass { background: rgba(0,0,0,.25); color: var(--felt-muted); font-family: var(--f-body); font-weight: 400; }
.seat .bub.hot { background: var(--red); color: #fff; }
.seat .bub .red { color: var(--red); }
.seat .dealer { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--card); color: var(--card-ink); font-size: 0.6875rem; font-weight: 700; margin-left: 4px; vertical-align: 1px; }
.p0 { bottom: 10px; left: 50%; transform: translateX(-50%); }
.p2 { top: 10px; left: 50%; transform: translateX(-50%); }
.p1 { right: 8px; top: 50%; transform: translateY(-50%); }
.p3 { left: 8px; top: 50%; transform: translateY(-50%); }
.backs { display: flex; }
.backs i { width: 10px; height: 16px; border-radius: 2px; background: repeating-linear-gradient(45deg, #8d2a2f 0 3px, #a8363b 3px 6px); border: 1px solid rgba(255,255,255,.6); margin-left: -4px; }
.contract { position: absolute; top: 10px; left: 10px; font-size: 0.75rem; background: rgba(0,0,0,.3); padding: 5px 9px; border-radius: 7px; line-height: 1.3; }
.contract b { font-family: var(--f-num); font-size: 0.9375rem; }
.contract .red { color: #ff8a8f; }
.plis { position: absolute; top: 10px; right: 10px; font-size: 0.75rem; background: rgba(0,0,0,.3); padding: 5px 9px; border-radius: 7px; font-family: var(--f-num); text-align: right; line-height: 1.4; }
.trick { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; transform: translate(-50%, -50%); }
.trick .card { position: absolute; }
.trick .t0 { bottom: 0; left: 50%; transform: translateX(-50%); }
.trick .t2 { top: 0; left: 50%; transform: translateX(-50%); }
.trick .t1 { right: 0; top: 50%; transform: translateY(-50%) rotate(6deg); }
.trick .t3 { left: 0; top: 50%; transform: translateY(-50%) rotate(-6deg); }
.trick .win { box-shadow: 0 0 0 3px var(--gold), 0 3px 8px rgba(0,0,0,.4); }
.card { --w: 50px; width: var(--w); height: calc(var(--w) * 1.42); border-radius: 6px; background: var(--card); color: var(--card-ink); box-shadow: 0 1px 3px rgba(0,0,0,.4); display: flex; flex-direction: column; justify-content: space-between; padding: 4px 5px; box-sizing: border-box; font-family: var(--f-display); user-select: none; flex: none; }
.card b { font-size: calc(var(--w) * 0.36); line-height: 1; font-weight: 700; }
.card i { font-style: normal; font-size: calc(var(--w) * 0.52); line-height: 1; align-self: flex-end; }
.card.red { color: var(--red); }
.card.sm { --w: 30px; padding: 2px 3px; border-radius: 4px; }
.handzone { background: var(--felt-2); padding-block: 12px 6px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.hand { display: flex; justify-content: center; }
.hand .card { --w: min(15vw, 62px); margin-left: calc(var(--w) * -0.18); border: 0; transition: transform .12s ease; }
.hand .card:first-child { margin-left: 0; }
.hand.mine .card.ok { transform: translateY(-10px); box-shadow: 0 0 0 2px var(--gold), 0 4px 8px rgba(0,0,0,.4); }
.hand.mine .card.no { filter: brightness(.62); }
.hand.hidden { color: var(--felt-muted); font-size: 0.875rem; justify-content: center; padding-block: 18px; }
.panel { background: var(--surface); color: var(--ink); border-radius: 14px 14px 0 0; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 10px; max-height: 52vh; overflow-y: auto; }
.status { font-weight: 700; font-size: 0.95rem; }
.vals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.vals button, .suits button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 0; font-family: var(--f-num); font-weight: 600; font-size: 0.95rem; }
.vals button.on, .suits button.on { background: var(--felt); color: var(--felt-ink); border-color: var(--felt); }
.suits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.suits button { font-size: 1.5rem; padding: 4px 0; font-family: var(--f-body); }
.suits button.red:not(.on) { color: var(--red); }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.acts .btn { padding: 12px 8px; }
.res-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.verdict { font-family: var(--f-display); font-size: 1.4rem; font-weight: 700; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.scoreline { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.scoreline div { background: var(--chip); border-radius: 9px; padding: 10px 12px; }
.scoreline .big { font-family: var(--f-num); font-size: 1.5rem; font-weight: 600; }
.hands4 { display: grid; grid-template-columns: 1fr; gap: 8px; }
.hands4 .h { display: flex; align-items: center; gap: 8px; }
.hands4 .h > span { width: 44px; font-size: 0.8rem; font-weight: 700; color: var(--muted); flex: none; }
.hands4 .cs { display: flex; flex-wrap: wrap; gap: 3px; }
.hands4 .card { box-shadow: 0 0 0 1px var(--line); }
.cover { position: fixed; inset: 0; z-index: 30; background: var(--felt-2); color: var(--felt-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px)); }
.cover h2 { font-size: 1.8rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.85); opacity: .3; } }
.trick .card { animation: pop .18s ease-out; }

/* ---- Ajouts version en ligne ---- */
a.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn.wa { background: #1f8f4e; color: #fff; }
.btn.sm { padding: 8px 12px; font-size: 0.875rem; }
.back { align-self: flex-start; }
.grow { flex: 1; }
.row.wrapr { flex-wrap: wrap; }
.join input { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: .15em; font-family: var(--f-num); }
.url { font-size: 0.8125rem; word-break: break-all; color: var(--muted); }
.share .row { flex-wrap: wrap; }
.lnk { background: none; border: 0; padding: 4px 0; color: var(--felt); font-weight: 700; font-size: 0.875rem; text-decoration: underline; text-underline-offset: 3px; }
:root:not([data-theme="light"]) .lnk { color: inherit; }
.you { font-size: 0.6875rem; letter-spacing: .06em; text-transform: uppercase; background: var(--gold); color: #1c1606; padding: 1px 6px; border-radius: 4px; font-weight: 700; }
.compass { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-areas: ". n ." "o m e" ". s ."; gap: 8px; align-items: stretch; }
.compass .sc { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.compass .sc b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.compass .s0 { grid-area: s; } .compass .s1 { grid-area: e; } .compass .s2 { grid-area: n; } .compass .s3 { grid-area: o; }
.compass .mid { grid-area: m; border-radius: 10px; background: radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--felt) 85%, white), var(--felt)); min-height: 70px; }
.gerr { padding: 0 12px 8px; background: var(--felt-2); }
body.in-game { overflow: hidden; }
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="engine.js"></script>
<script src="table.js"></script>
<script src="app.js"></script>

</html>
